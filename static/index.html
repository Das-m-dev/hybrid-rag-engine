<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ask the docs</title>
<style>
:root{--bg:#f6f7f5;--fg:#1d2420;--mut:#5d6a63;--card:#fff;--line:#d9dfdb;--acc:#1f6f5c}
@media(prefers-color-scheme:dark){:root{--bg:#141a17;--fg:#e6ebe8;--mut:#93a39a;--card:#1c2420;--line:#2b3631;--acc:#5fc4a8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 20px 120px}
h1{font-size:1.4rem;margin:0 0 4px}#st{color:var(--mut);font-size:.85rem;margin-bottom:24px}
.q{font-weight:600;margin:28px 0 8px}.a{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;white-space:pre-wrap}
details{margin-top:8px;border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:.88rem}
summary{cursor:pointer;color:var(--acc)}details p{margin:6px 0;white-space:pre-wrap;color:var(--mut)}
form{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 20px}
.row{max-width:760px;margin:0 auto;display:flex;gap:8px}
input{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
button{font:inherit;padding:10px 18px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.5}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body><main>
<h1>Ask the docs</h1><div id="st">Checking index…</div><div id="log"></div></main>
<form id="f"><div class="row"><input id="q" placeholder="Ask a question about your documents" autocomplete="off" autofocus>
<button id="b">Ask</button></div></form>
<script>
const $=id=>document.getElementById(id),log=$("log");
fetch("/api/health").then(r=>r.json()).then(h=>{$("st").textContent=
  h.chunks?`${h.chunks} passages indexed · ${h.llm_model}`:"No documents indexed. Run: python ingest.py <folder>"});
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
$("f").onsubmit=async e=>{e.preventDefault();const q=$("q").value.trim();if(!q)return;
  $("q").value="";$("b").disabled=true;log.append(el("div","q",q));const a=el("div","a","Searching…");log.append(a);
  try{const r=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q})});
    const d=await r.json();if(!r.ok)throw new Error(d.detail);a.textContent=d.answer;let last=a;
    d.sources.forEach((s,i)=>{const dt=el("details");dt.append(el("summary","",`[${i+1}] ${s.source}${s.heading?" – "+s.heading:""} (match ${s.score})`),el("p","",s.text));last.after(dt);last=dt});
  }catch(err){a.textContent="Error: "+err.message}
  $("b").disabled=false;window.scrollTo(0,document.body.scrollHeight)};
</script></body></html>
